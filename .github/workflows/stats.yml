name: Generate GitHub Stats Cards

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        with:
          USERNAME: crisnahine
          THEME: github_dark
          BRANCH_NAME: stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
